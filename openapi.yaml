components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Copy data.accessToken tu API login va dan token thuan vao day. Khong dan refreshToken va khong them chu Bearer.
  parameters:
    MaTruongCode:
      name: maTruongCode
      in: path
      required: true
      schema:
        type: string
      description: Ma truong dang ky trong he thong
  schemas:
    ApiSuccess:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          nullable: true
          additionalProperties: true
    ApiError:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              nullable: true
    HealthResponse:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
    PublicRole:
      type: object
      properties:
        id:
          type: integer
        code:
          type: string
          example: SINH_VIEN
        name:
          type: string
    PublicUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        phoneNumber:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        status:
          type: string
        role:
          $ref: '#/components/schemas/PublicRole'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    LoginRequest:
      type: object
      required: [email, password]
      example:
        email: rosie.posie40404@gmail.com
        password: "123456789"
      properties:
        email:
          type: string
          format: email
          example: rosie.posie40404@gmail.com
        password:
          type: string
          format: password
          example: "123456789"
        fcmToken:
          type: string
          nullable: true
        deviceType:
          type: string
          nullable: true
          example: web
    GoogleLoginRequest:
      type: object
      required: [idToken]
      properties:
        idToken:
          type: string
        fcmToken:
          type: string
          nullable: true
        deviceType:
          type: string
          nullable: true
    LoginResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/PublicUser'
            accessToken:
              type: string
              description: Token dung de bam Authorize tren Swagger
            refreshToken:
              type: string
              description: Token chi dung cho API refresh/logout, khong dung de Authorize
            refreshTokenExpiresAt:
              type: string
              format: date-time
    RefreshTokenRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
        fcmToken:
          type: string
          nullable: true
        deviceType:
          type: string
          nullable: true
    RefreshTokenResponse:
      allOf:
        - $ref: '#/components/schemas/LoginResponse'
    LogoutRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
    LoggedOutResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            loggedOut:
              type: boolean
              example: true
    RegisterStudentRequest:
      type: object
      required: [email, password, fullName, maSinhVien]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
        fullName:
          type: string
        maSinhVien:
          type: string
        phoneNumber:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        maTruong:
          type: integer
          nullable: true
        maTruongCode:
          type: string
          nullable: true
        nganhHoc:
          type: string
          nullable: true
        khoaHoc:
          type: string
          nullable: true
    RegisterStudentResponse:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
    UserResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/PublicUser'
    SchoolRequestBase:
      type: object
      properties:
        maTruongCode:
          type: string
        tenTruong:
          type: string
        emailDomain:
          type: string
          nullable: true
        website:
          type: string
          nullable: true
        diaChi:
          type: string
          nullable: true
    CreateSchoolRequest:
      allOf:
        - $ref: '#/components/schemas/SchoolRequestBase'
    UpdateSchoolRequest:
      allOf:
        - $ref: '#/components/schemas/SchoolRequestBase'
    SchoolResponse:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
    SchoolListResponse:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
    SchoolDeleteResponse:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
    UpdateScoreScaleRequest:
      type: object
      additionalProperties: true
    UpdateAcademicStandingRequest:
      type: object
      additionalProperties: true
    AcademicRulesResponse:
      allOf:
        - $ref: '#/components/schemas/ApiSuccess'
  responses:
    ValidationError:
      description: Du lieu gui len khong hop le
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    UnauthorizedError:
      description: Thieu hoac sai the xac thuc
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ForbiddenError:
      description: Khong co quyen thuc hien thao tac nay
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFoundError:
      description: Khong tim thay du lieu phu hop
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ConflictError:
      description: Du lieu bi trung hoac xung dot
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    AccountLockedError:
      description: Tai khoan da bi khoa
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
